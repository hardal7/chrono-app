name: chrono
description: "Sessions based study tracker."
publish_to: 'none'

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # Widgets
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1
  # Path & Environment
  flutter_dotenv: ^6.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  # Utilities
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  image_picker: ^1.2.3
  #Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  sqflite_common_ffi_web: ^1.1.2
  # HTTP Handling
  dio: ^5.9.2
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  # Localizations
  flutter_localizations:
    sdk: flutter
  intl: any
  # App Icon
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/sounds/

